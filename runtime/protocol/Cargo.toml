[package]
name = "bridge-runtime-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.0", features = ["serde", "v4"] }
base64 = "=0.23.1"
sha2 = "=0.10.9"

[dev-dependencies]
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
sha1 = "=0.10.6"
serde_yaml_ng = "=0.10.0"
flate2 = "=1.1.10"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "stream"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
libc = "=0.2.191"
semver = "=1.0.28"
tokio = { version = "=1.54.1", features = ["process", "io-util", "sync", "rt", "macros", "time", "net", "fs"] }
tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"
core-foundation = "=0.10.1"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_IO", "Win32_System_SystemServices", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_System_Com", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices"] }
